name: Windows safety regressions
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest httpx
      - name: Compile modules
        run: python -m compileall -q gamelens tests
      - name: Test isolated input, transport and setup
        run: >-
          python -m pytest -q
          tests/test_review_safety.py
          tests/test_transport_security.py
          tests/test_installer_registration.py
          tests/test_mcp.py
          tests/test_multi_client.py
          tests/test_http_auth.py
          tests/test_plugins.py
          tests/test_session_control_routing.py
